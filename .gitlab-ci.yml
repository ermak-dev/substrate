workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages: [check, infrastructure]

variables:
  GIT_DEPTH: "0"
  FF_GIT_URLS_WITHOUT_TOKENS: "true"

.go-check:
  stage: check
  tags: [docker, build]
  timeout: 60 minutes
  interruptible: true

go-test:
  extends: .go-check
  resource_group: substrate-native-go-tests
  tags: [docker, build]
  script: [.ci/run.sh test]

go-verify:
  extends: .go-check
  tags: [docker, build]
  script: [.ci/run.sh verify]

go-repeat:
  extends: .go-check
  resource_group: substrate-native-go-tests
  tags: [docker, build]
  script: [.ci/run.sh repeat]

lxc-e2e:
  stage: infrastructure
  tags: [substrate-lxc-e2e]
  resource_group: substrate-lxc-e2e
  timeout: 60 minutes
  rules:
    - if: '$RUN_LXC_E2E == "true"'
  script: [.ci/e2e.sh]
